<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex">
<title>Apollo Photo Review</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
:root {
  --ground: #eef1ee; --surface: #ffffff; --ink: #1b2320; --muted: #5d6a65; --rule: #d3dad6;
  --accent: #b8741a; --accent-ink: #ffffff; --plate: #0b0d0c;
  --good: #2f7d4f; --good-soft: #e1f0e6; --flag: #b3541e; --flag-soft: #f8e7dc; --chip: #f3f5f3;
  --mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
  --sans: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --ground: #101513; --surface: #182019; --ink: #e3eae5; --muted: #98a69f; --rule: #2c3830; --accent: #e3a444; --accent-ink: #14100a; --good: #6cc48f; --good-soft: #1c3226; --flag: #f0975f; --flag-soft: #3a2518; --chip: #1f2922; color-scheme: dark; }
}
:root[data-theme="dark"] { --ground: #101513; --surface: #182019; --ink: #e3eae5; --muted: #98a69f; --rule: #2c3830; --accent: #e3a444; --accent-ink: #14100a; --good: #6cc48f; --good-soft: #1c3226; --flag: #f0975f; --flag-soft: #3a2518; --chip: #1f2922; color-scheme: dark; }
[hidden] { display: none !important; }   /* the artifact host added this; the site copy needs it too */
html, body { height: 100%; }
body { margin: 0; background: var(--ground); color: var(--ink); font: 15px/1.45 var(--sans); overflow: hidden; }
button { font-family: var(--sans); }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button:disabled, input:disabled { opacity: .45; cursor: not-allowed; }
.app { height: 100%; display: flex; flex-direction: column; }

/* top bar */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 8px 16px; background: var(--surface); border-bottom: 1px solid var(--rule); }
.top h1 { font-size: 1rem; margin: 0; white-space: nowrap; }
.counts { font: 600 .76rem/1.2 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; display: flex; gap: 10px; }
.counts b { color: var(--ink); }
.top .spacer { flex: 1; }
.top select { font: 500 .88rem var(--sans); padding: 5px 8px; border: 1px solid var(--rule); border-radius: 6px; background: var(--surface); color: var(--ink); }
.tbtn { font: 600 .88rem var(--sans); padding: 6px 12px; border: 1px solid var(--rule); border-radius: 6px; background: var(--chip); color: var(--ink); cursor: pointer; white-space: nowrap; }
.nav { display: flex; align-items: center; gap: 6px; }
.pos { font: 600 .8rem var(--mono); color: var(--muted); min-width: 4.5em; text-align: center; font-variant-numeric: tabular-nums; }

/* filmstrip */
.strip { display: flex; gap: 6px; overflow-x: auto; padding: 6px 16px; background: var(--surface); border-bottom: 1px solid var(--rule); scrollbar-width: thin; }
.strip button { flex: 0 0 auto; width: 48px; height: 48px; padding: 0; border: 2px solid transparent; border-radius: 6px; background: var(--plate); position: relative; cursor: pointer; }
.strip img { width: 100%; height: 100%; object-fit: cover; border-radius: 4px; display: block; }
.strip button[aria-current="true"] { border-color: var(--accent); }
.strip button::after { content: ""; position: absolute; right: 2px; bottom: 2px; width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--plate); background: transparent; }
.strip button[data-state="good"]::after { background: var(--good); }
.strip button[data-state="flag"]::after { background: var(--flag); }

/* work area */
.work { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 360px; }
.stage { position: relative; background: var(--plate); overflow: hidden; touch-action: none; cursor: zoom-in; user-select: none; -webkit-user-select: none; }
.stage.zoomed { cursor: grab; }
.zoomer { position: absolute; inset: 0; transform-origin: 0 0; }
.zoomer img, .zoomer canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; -webkit-user-drag: none; }
.stage-label { position: absolute; left: 10px; top: 10px; margin: 0; padding: 3px 8px; border-radius: 4px; background: rgba(0,0,0,.6); color: #e3eae5; font-size: .8rem; pointer-events: none; }
.zoom-ctl { position: absolute; right: 10px; bottom: 10px; display: flex; gap: 4px; }
.zoom-ctl button { width: 36px; height: 36px; border: 0; border-radius: 6px; background: rgba(0,0,0,.6); color: #e3eae5; font: 600 1.05rem var(--sans); cursor: pointer; }
.side { overflow-y: auto; padding: 14px 16px 28px; display: grid; gap: 12px; align-content: start; background: var(--surface); border-left: 1px solid var(--rule); }
.side header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 10px; }
.side h2 { margin: 0; font-size: 1.05rem; }
.fid { font: 600 .76rem/1 var(--mono); color: var(--muted); }
.status { font: 600 .7rem/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; padding: 4px 8px; border-radius: 4px; background: var(--chip); color: var(--muted); }
.status[data-state="good"] { background: var(--good-soft); color: var(--good); }
.status[data-state="flag"] { background: var(--flag-soft); color: var(--flag); }
.cap { margin: 0; font-size: .84rem; color: var(--muted); }
.good-btn { font: 600 1rem var(--sans); padding: 10px 12px; border-radius: 8px; border: 1px solid var(--good); background: transparent; color: var(--good); cursor: pointer; }
.good-btn[aria-pressed="true"] { background: var(--good); color: var(--surface); }
.verdicts { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.reject-btn { font: 600 .92rem var(--sans); padding: 10px 14px; border-radius: 8px; border: 1px solid var(--rule); background: var(--chip); color: var(--muted); cursor: pointer; }
.reject-btn[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.status[data-state="reject"] { background: var(--ink); color: var(--surface); }
.strip button[data-state="reject"] img { opacity: .3; }
.strip button[data-state="reject"]::after { background: var(--muted); }
.compare { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: .8rem; color: var(--muted); }
.compare button { display: flex; align-items: center; gap: 6px; padding: 3px 8px 3px 3px; border: 1px solid var(--rule); border-radius: 6px; background: var(--chip); color: var(--ink); font: 500 .8rem var(--sans); cursor: pointer; white-space: nowrap; }
.compare button[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.compare img { width: 30px; height: 30px; object-fit: cover; border-radius: 4px; background: var(--plate); }
.panel { display: grid; gap: 4px; }
.group-label { font: 600 .68rem/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 8px 0 2px; }
.dial { display: grid; grid-template-columns: 6.2em 1fr 3.2em; gap: 8px; align-items: center; font-size: .88rem; }
.dial input { width: 100%; accent-color: var(--accent); margin: 0; }
.dial output { font: 600 .8rem var(--mono); font-variant-numeric: tabular-nums; text-align: right; color: var(--muted); }
.dial[data-set="true"] output { color: var(--flag); }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: .88rem; }
.row button, .flags button { font: 500 .86rem var(--sans); padding: 6px 10px; border-radius: 6px; border: 1px solid var(--rule); background: var(--chip); color: var(--ink); cursor: pointer; }
.row .rot { font: 600 .8rem var(--mono); color: var(--muted); min-width: 5.5em; }
.row .reset { margin-left: auto; }
.flags { display: flex; flex-wrap: wrap; gap: 6px; }
.flags button[aria-pressed="true"] { background: var(--flag); border-color: var(--flag); color: var(--surface); }
.note { width: 100%; box-sizing: border-box; font: .9rem var(--sans); padding: 7px 9px; border: 1px solid var(--rule); border-radius: 6px; background: var(--ground); color: var(--ink); }
.hint { margin: 0; font-size: .78rem; color: var(--muted); min-height: 2.4em; }
.hint b { color: var(--flag); font-weight: 600; }
.keys { margin: 0; font-size: .74rem; color: var(--muted); }
.notice { margin: 0; padding: 8px 16px; background: var(--flag-soft); color: var(--ink); font-size: .88rem; }

@media (max-width: 760px) {
  .top { padding: 6px 12px; gap: 6px 10px; }
  .top h1, .counts .extra, .keys { display: none; }
  .strip { padding: 5px 12px; }
  .strip button { width: 40px; height: 40px; }
  .work { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 52fr) minmax(0, 48fr); }
  .side { border-left: 0; border-top: 1px solid var(--rule); padding: 12px 16px 24px; }
}

.signin { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: var(--ground); padding: 16px; }
.signin form { display: grid; gap: 10px; width: min(100%, 340px); background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 20px; }
.signin h2 { margin: 0; font-size: 1.2rem; }
.signin p { margin: 0; color: var(--muted); font-size: .9rem; }
.signin input { font: 1rem var(--sans); padding: 8px 10px; border: 1px solid var(--rule); border-radius: 6px; background: var(--ground); color: var(--ink); }
.signin button { font: 600 1rem var(--sans); padding: 9px; border: 0; border-radius: 6px; background: var(--accent); color: var(--accent-ink); cursor: pointer; }
.signin .signin-error { color: var(--flag); min-height: 1.2em; }
</style>
<div class="app">
  <div class="top">
    <h1>Apollo Photo Review</h1>
    <div class="counts" id="counts"></div>
    <span class="spacer"></span>

      <div class="zoomer" id="zoomer">
        <img id="photo" alt="">
        <canvas id="preview" hidden></canvas>
        <img id="alt" alt="" hidden>
      </div>
      <p class="stage-label" id="stage-label" hidden></p>
      <div class="zoom-ctl">
        <button type="button" id="zoom-out" aria-label="Zoom out">−</button>
        <button type="button" id="zoom-in" aria-label="Zoom in">+</button>
      </div>
    </div>
    <aside class="side" id="side">
      <header><h2 id="title"></h2><span class="status" id="status"></span></header>
      <p class="cap" id="cap"></p>
      <div class="verdicts">
        <button type="button" class="good-btn" id="good" aria-pressed="false">Looks good</button>
        <button type="button" class="reject-btn" id="reject" aria-pressed="false" title="A bad or unusable frame: leave it off the site">Reject</button>
      </div>
      <div class="compare" id="compare"></div>
      <div class="panel" id="panel"></div>

      <p class="hint" id="hint"></p>
      <p class="keys">Tap the photo to zoom; pinch or scroll to zoom further, drag to move. Keys: ← → photos, Z zoom, Ctrl/⌘+Z undo.</p>
    </aside>
  </div>
</div>
<script>
// On the site, the review page keeps its marks in our own database
// (worker/index.js, /api/review/...) instead of claude.ai's artifact store.
// This shim gives script.js the same small interface it uses there
// (claude.use('db') / claude.use('user')), plus a password sign-in.
(() => {
  const API = '/api/review'
  const api = (path, opts = {}) =>
    fetch(API + path, { credentials: 'same-origin', ...opts, headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) } })

  function signIn() {
    const box = document.createElement('div')
    box.className = 'signin'
    box.innerHTML = `<form><h2>Photo review</h2><p>Enter the review password.</p>
      <input type="password" id="review-password" autocomplete="current-password" aria-label="Password" required>
      <button type="submit">Sign in</button><p class="signin-error" role="alert"></p></form>`
    document.body.appendChild(box)
    const form = box.querySelector('form')
    box.querySelector('input').focus()
    form.addEventListener('submit', async (e) => {
      e.preventDefault()
      const r = await api('/login', { method: 'POST', body: JSON.stringify({ password: box.querySelector('input').value }) })
      if (r.ok) location.reload()
      else box.querySelector('.signin-error').textContent = (await r.json().catch(() => ({}))).error || 'Sign-in failed.'
    })
  }

  const db = {
    collection(name) {
      if (name !== 'reviews') throw new Error('only reviews')
      return {
        doc: (id) => ({
          set: async (body) => {
            const r = await api(`/marks/${encodeURIComponent(id)}`, { method: 'PUT', body: JSON.stringify(body) })
            if (!r.ok) throw { code: r.status === 401 ? 'invalid_argument' : 'unavailable' }
          },
          delete: async () => {
            const r = await api(`/marks/${encodeURIComponent(id)}`, { method: 'DELETE' })
            if (!r.ok) throw { code: 'unavailable' }
          },
        }),
        // Polls every 20 s (and when the tab comes back) and reports what changed.
        onSnapshot(next, onError) {
          let known = new Map()
          let stopped = false
          async function poll() {
            if (stopped) return
            try {
              const r = await api('/marks')
              if (r.status === 401) { onError && onError({ code: 'revoked' }); return }
              const { reviews } = await r.json()
              const now = new Map(reviews.map((d) => [d.id, d]))
              const changes = []
              for (const [id, d] of now) {
                const old = known.get(id)
                if (!old || old.updated !== d.updated) changes.push({ type: old ? 'modified' : 'added', doc: { id, exists: true, data: () => d.data } })
              }
              for (const [id, d] of known) if (!now.has(id)) changes.push({ type: 'removed', doc: { id, exists: true, data: () => d.data } })
              known = now
              if (changes.length) next({ docChanges: () => changes })
            } catch { /* try again next time */ }
          }
          poll()
          const t = setInterval(poll, 20000)
          const vis = () => document.visibilityState === 'visible' && poll()
          document.addEventListener('visibilitychange', vis)
          return () => { stopped = true; clearInterval(t); document.removeEventListener('visibilitychange', vis) }
        },
      }
    },
  }
  const user = {
    id: async () => 'reviewer',
    can: async () => true,
    profiles: async (ids) => Object.fromEntries([].concat(ids).map((i) => [i, { id: i, name: i === 'reviewer' ? 'you' : 'a reviewer' }])),
  }

  let signedIn = null
  window.claude = {
    use: async (name) => {
      signedIn ??= api('/me').then((r) => r.ok)
      if (!(await signedIn)) {
        if (name === 'db') signIn()
        return null
      }
      return name === 'db' ? db : name === 'user' ? user : null
    },
  }
})()

const signed = v => v === 0 ? '0' : (v > 0 ? '+' : '−') + Math.abs(v);

const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },

// ---------- building the controls once ----------
let group = '';
$('panel').innerHTML = DIALS.map(d => {

  return `${head}<div class="dial" data-k="${d.k}"><label for="dial-${d.k}">${d.label}</label><input type="range" id="dial-${d.k}" min="${d.min ?? -8}" max="${d.max ?? 8}" step="${d.step ?? 1}" value="0"><output for="dial-${d.k}">0</output></div>`;
}).join('');
$('flags').innerHTML = TOGGLES.map(([k, label]) => `<button type="button" data-k="${k}" aria-pressed="false">${label}</button>`).join('');
const dialRows = [...document.querySelectorAll('.dial')];
const toggles = [...document.querySelectorAll('#flags button')];

$('strip').innerHTML = FRAMES.map(f => `<button type="button" data-id="${f.id}" aria-label="${f.id}" aria-current="false"><img src="${f.thumb}" alt="" loading="lazy"></button>`).join('');

// ---------- showing a photo ----------
function show(id) {
  if (!byId[id]) return;
  if (cur && cur !== id) { commitDraft(cur); for (const k in baseCache) if (!k.startsWith(id + ':')) delete baseCache[k]; }
  cur = id; compareWith = null;
  store.set('apollo-review-at', id);
  const f = byId[id];
  $('title').innerHTML = `Apollo ${f.mission} <span class="fid">${f.id}</span>`;
  $('cap').textContent = f.caption || '';
  $('cap').hidden = !f.caption;
  const refs = [['raw', 'Raw scan', f.raw]];
  if (f.before) refs.push(['before', 'First version', f.before]);
  if (f.nasa) refs.push(['nasa', "NASA's release", f.nasa]);
  $('compare').innerHTML = '<span>Compare:</span>' + refs.map(([k, label, src]) => `<button type="button" data-cmp="${k}" aria-pressed="false"><img src="${src}" alt="">${label}</button>`).join('');
  $('photo').src = f.ours;
  $('photo').alt = `Apollo ${f.mission} frame ${f.id}, our cleanup`;
  $('preview').hidden = true; $('photo').hidden = false; $('alt').hidden = true;
  drawn = null;
  resetZoom();
  Object.values(thumbs).forEach(b => b.setAttribute('aria-current', String(b.dataset.id === id)));
  thumbs[id].scrollIntoView({block: 'nearest', inline: 'nearest'});
  paint();

}
function move(step) {
  const i = queue.indexOf(cur);
  const j = i < 0 ? 0 : i + step;
  if (j >= 0 && j < queue.length) show(queue[j]);
}

function paint() {
  if (!cur) return;
  const id = cur, f = byId[id], r = reviews[id], v = values(id), [st, label] = stateOf(id);
  $('status').textContent = label; $('status').dataset.state = st;
  $('good').setAttribute('aria-pressed', String(st === 'good'));
  $('reject').setAttribute('aria-pressed', String(st === 'reject'));
  dialRows.forEach(row => {
    const d = DIALS.find(x => x.k === row.dataset.k), input = row.querySelector('input');
    if (!(drafts[id] && document.activeElement === input)) input.value = v[d.k];
    row.querySelector('output').textContent = fmt(d, v[d.k]);
    row.dataset.set = String(v[d.k] !== rendered(f, d.k));
  });
  $('rot').textContent = rotLabel(v.rotate);
  toggles.forEach(b => b.setAttribute('aria-pressed', String(!!(r && r[b.dataset.k]))));
  if (document.activeElement !== $('note')) $('note').value = (r && r.note) || '';
  writable().forEach(x => { x.disabled = !canWrite; });
  const i = queue.indexOf(id);
  $('pos').textContent = i < 0 ? '–' : `${i + 1} / ${queue.length}`;
  $('prev').disabled = i <= 0; $('next').disabled = i < 0 || i >= queue.length - 1;
  paintHint();
}
async function paintHint() {
  const id = cur, r = reviews[id], pend = pendingKeys(values(id), byId[id]).length > 0;
  let who = '';
  if (r && r.by) who = `${r.verdict === 'check' ? 'Re-run after marks' : 'Marked'} by ${await nameOf(r.by)}, ${ago(r.at)}.`;
  if (id !== cur) return;
  $('hint').innerHTML = (pend ? '<b>Preview.</b> Saved; the full-size photo gets these settings on the next run. ' : '') + esc(who);
}
function paintThumb(id) { thumbs[id].dataset.state = stateOf(id)[0]; }
function paintCounts() {
  const n = {todo: 0, good: 0, flag: 0, reject: 0};
  FRAMES.forEach(f => n[stateOf(f.id)[0]]++);
  $('counts').innerHTML = `<span><b>${n.good}</b>/${FRAMES.length} good</span><span class="extra"><b>${n.flag}</b> need work</span><span class="extra"><b>${n.todo}</b> to review</span><span class="extra"><b>${n.reject}</b> rejected</span>`;
}
const profileCache = {};
async function nameOf(by) {
  if (by === myId) return 'you';
  if (!userNs) return 'Someone';
  if (!(by in profileCache)) profileCache[by] = (await userNs.profiles([by]))[by].name || 'Someone';
  return profileCache[by];
}
// A filter picks its photos when you choose it; photos don't drop out while you work on them.
function applyFilter(value) {
  queue = FRAMES.map(f => f.id).filter(id => value === 'all' || stateOf(id)[0] === value);
  FRAMES.forEach(f => { thumbs[f.id].hidden = !queue.includes(f.id); });
  if (queue.length && !queue.includes(cur)) show(queue[0]); else paint();
}

// ---------- saving, with undo ----------
const chains = {};
function save(id, body, record = true) {
  const prev = reviews[id] ? {...reviews[id]} : null;
  if (record) { undoSteps.push({id, prev}); $('undo').disabled = false; }
  if (body) reviews[id] = body; else delete reviews[id];
  delete drafts[id];
  afterChange(id);
  if (!db) return;
  const ref = db.collection('reviews').doc(id);
  chains[id] = (chains[id] || Promise.resolve()).then(() => body ? ref.set(body) : ref.delete()).catch(e => {
    if (prev) reviews[id] = prev; else delete reviews[id];
    if (e && e.code === 'invalid_argument') canWrite = false;
    afterChange(id);
  });
}
function afterChange(id) {
  paintThumb(id); paintCounts();
  if (id === cur) { paint(); schedulePreview(true); }
}
function undo() {
  const step = undoSteps.pop();
  $('undo').disabled = undoSteps.length === 0;
  if (!step) return;
  if (step.id !== cur) show(step.id);
  save(step.id, step.prev, false);
}
const blank = () => ({...Object.fromEntries(KEYS.map(k => [k, 0])), colour: false, crop: false, note: ''});
const current = id => ({...blank(), ...(reviews[id] || {}), ...(drafts[id] || {})});
const stamp = r => Object.assign(r, {by: myId, at: new Date().toISOString()});
function commit(id, r) {

  if ((r.verdict === 'good' && !r.colour && !r.crop) || r.verdict === 'reject') return save(id, stamp(r));   // adjusting an approved photo keeps it approved
  r.verdict = (pend || r.colour || r.crop) ? 'flag' : (r.note && !f.rendered ? 'note' : 'check');
  save(id, stamp(r));
}
function commitDraft(id) {

  commit(id, r);

// off the site and skipped by the pipeline; un-reject by tapping again.
function toggleReject() {
  const id = cur, r = current(id);
  if (r.verdict === 'reject') { delete r.verdict; return commit(id, r); }
  r.verdict = 'reject';
  save(id, stamp(r));
  setTimeout(() => { if (cur === id) move(1); }, 250);
}

  const id = cur, r = current(id);
  if (r.verdict === 'good') { delete r.verdict; return commit(id, r); }
  r.colour = false; r.crop = false; r.verdict = 'good';
  save(id, stamp(r));
  setTimeout(() => { if (cur === id) move(1); }, 250);   // on to the next photo

// ---------- zoom ----------
const stage = $('stage'), zoomer = $('zoomer');

}

    const k = Math.min(8, Math.max(1, s)) / gesture.s0;

    Z.y = gesture.my - (gesture.my - gesture.zy) * k + ((a.y + b.y) / 2 - gesture.my);

  }
});
function endPointer(e) {
  if (!pointers.has(e.pointerId)) return;

  if (gesture && gesture.kind === 'pan' && pointers.size === 1 && !gesture.moved && Date.now() - gesture.t < 400) {

  }
  pointers.delete(e.pointerId);

stage.addEventListener('pointerup', endPointer);
stage.addEventListener('pointercancel', endPointer);
stage.addEventListener('wheel', e => {
  e.preventDefault();
  const rect = stage.getBoundingClientRect();
  zoomAt(e.clientX - rect.left, e.clientY - rect.top, Math.min(8, Math.max(1, Z.s * Math.exp(-e.deltaY * 0.0015))));

$('zoom-in').addEventListener('click', () => zoomAt(stage.clientWidth / 2, stage.clientHeight / 2, Math.min(8, Z.s * 1.6)));
$('zoom-out').addEventListener('click', () => { const s = Z.s / 1.6; if (s <= 1.05) resetZoom(); else zoomAt(stage.clientWidth / 2, stage.clientHeight / 2, s); });
window.addEventListener('resize', applyZoom);

// ---------- live preview ----------
function tone(L, v) {
  const b = v.brightness + DEFAULT_BRIGHTNESS, c = v.contrast + DEFAULT_CONTRAST;
  let x = Math.pow(Math.min(Math.max(L, 0), 100) / 100, MID_GAMMA * Math.pow(BSTEP, b)) * 100;
  if (c) {
    const k = CSTEP * Math.abs(c);

    d = c > 0 ? Math.tanh(k * d) / Math.tanh(k) : Math.atanh(Math.max(-1, Math.min(1, d)) * Math.tanh(k)) / k;
    x = 50 + 50 * d;
  }
  x = x - SHOULDER * 100 * Math.pow(x / 100, 3);
  if (v.shadows || v.highlights) {
    const t = x / 100;
    x = x + TSTEP * (v.shadows * t * (1 - t) * (1 - t) + v.highlights * (1 - t) * t * t);

}
const TO_LIN = new Float32Array(256).map((_, i) => { const v = i / 255; return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });

const M = [[0.4124, 0.3576, 0.1805], [0.2126, 0.7152, 0.0722], [0.0193, 0.1192, 0.9505]], W = [0.95047, 1, 1.08883];
const MI = (() => {
  const [[a, b, c], [d, e, f], [g, h, i]] = M, det = a * (e * i - f * h) - b * (d * i - f * g) + c * (d * h - e * g);
  return [[(e * i - f * h) / det, (c * h - b * i) / det, (b * f - c * e) / det],
          [(f * g - d * i) / det, (a * i - c * g) / det, (c * d - a * f) / det],
          [(d * h - e * g) / det, (b * g - a * h) / det, (a * e - b * d) / det]];
})();
const fLab = t => t > 0.008856 ? Math.cbrt(t) : 7.787 * t + 16 / 116;
const fInv = t => t > 0.2069 ? t * t * t : (t - 16 / 116) / 7.787;

// The photo as shown was made with the frame's `rendered` settings. Undo
// those once (back to pre-dial lightness and colour) and cache the result,
// small for dragging and full size for when you let go.
const baseCache = {};
async function base(id, full) {
  const key = id + ':' + (full ? 'full' : 'small');
  if (baseCache[key]) return baseCache[key];
  const f = byId[id], R = Object.fromEntries(KEYS.map(k => [k, rendered(f, k)]));
  const img = new Image();
  img.src = f.ours;
  await img.decode();
  const scale = full ? 1 : Math.min(1, 800 / Math.max(img.naturalWidth, img.naturalHeight));
  const w = Math.round(img.naturalWidth * scale), h = Math.round(img.naturalHeight * scale);
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d'); ctx.drawImage(img, 0, 0, w, h);
  const px = ctx.getImageData(0, 0, w, h).data;
  const N = 2000, fwd = new Float64Array(N + 1);
  for (let i = 0; i <= N; i++) fwd[i] = tone(100 * i / N, R);
  const inv = new Float32Array(1001);
  for (let i = 0, j = 0; i <= 1000; i++) {
    const Ls = i / 10;
    while (j < N && fwd[j + 1] < Ls) j++;
    const span = j < N ? fwd[j + 1] - fwd[j] : 0;
    // Pixels a touch brighter than the curve's top (JPEG ringing on clouds) map to white, never past it.
    inv[i] = Math.min(100, 100 * (j + (span > 0 ? Math.max(0, Math.min(1, (Ls - fwd[j]) / span)) : 0)) / N);
  }

  for (let p = 0, q = 0; p < px.length; p += 4, q++) {

    const fx = fLab((M[0][0] * r + M[0][1] * g + M[0][2] * b) / W[0]);
    const fy = fLab((M[1][0] * r + M[1][1] * g + M[1][2] * b) / W[1]);
    const fz = fLab((M[2][0] * r + M[2][1] * g + M[2][2] * b) / W[2]);
    const L = inv[Math.max(0, Math.min(1000, Math.round((116 * fy - 16) * 10)))];

let frame = 0, wantFull = false, drawn = null;
function schedulePreview(full) {
  wantFull = wantFull || !!full;
  if (!frame) frame = requestAnimationFrame(() => { frame = 0; const fl = wantFull; wantFull = false; drawPreview(cur, fl); });
}
async function drawPreview(id, full) {
  if (!id) return;
  const f = byId[id], v = values(id), canvas = $('preview');
  const turn = ((v.rotate - rendered(f, 'rotate')) % 360 + 360) % 360;
  const same = turn === 0 && DIALS.every(d => v[d.k] === rendered(f, d.k));
  if (same) { canvas.hidden = true; $('photo').hidden = !!compareWith; drawn = null; return; }
  const key = [...DIALS.map(d => v[d.k]), turn, full ? 'F' : 's'].join(',');
  if (drawn === key) return;
  let B;
  try { B = await base(id, full); } catch (e) { return; }
  const now = values(id);
  if (cur !== id || KEYS.some(k => now[k] !== v[k])) return;   // moved on while loading; a newer draw is queued
  const lut = new Float32Array(1001);
  for (let i = 0; i <= 1000; i++) lut[i] = tone(i / 10, v);
  const sat = 1 + SATSTEP * v.saturation, tA = COLSTEP * v.tint, tB = COLSTEP * v.warmth;
  const {w, h, L0, A0, B0, fade, off, data} = B, px = data.data;
  for (let q = 0, p = 0; q < L0.length; q++, p += 4) {
    const L = lut[Math.max(0, Math.min(1000, Math.round(L0[q] * 10)))];
    const fy = (L + 16) / 116, fx = fy + (A0[q] * sat + tA * fade[q]) / 500, fz = fy - (B0[q] * sat + tB * fade[q]) / 200;
    const X = fInv(fx) * W[0], Y = fInv(fy) * W[1], Z3 = fInv(fz) * W[2];
    for (let ch = 0; ch < 3; ch++) {
      const lin = MI[ch][0] * X + MI[ch][1] * Y + MI[ch][2] * Z3;
      px[p + ch] = TO_SRGB[Math.max(0, Math.min(4096, Math.round(lin * 4096)))];
    }
    px[p + 3] = 255;

  // zooms just enough to hide the corners, as the pipeline crops.
  const quarter = turn === 90 || turn === 270, cw = quarter ? h : w, ch = quarter ? w : h;
  if (canvas.width !== cw || canvas.height !== ch) { canvas.width = cw; canvas.height = ch; }
  const th = (v.straighten - rendered(f, 'straighten')) * Math.PI / 180;
  const k = Math.cos(Math.abs(th)) + Math.max(w / h, h / w) * Math.sin(Math.abs(th));
  const ctx = canvas.getContext('2d');
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, cw, ch);

}

// ---------- compare ----------
$('compare').addEventListener('click', e => {
  const b = e.target.closest('[data-cmp]'); if (!b) return;
  const f = byId[cur], which = b.dataset.cmp;
  compareWith = compareWith === which ? null : which;
  document.querySelectorAll('[data-cmp]').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.cmp === compareWith)));
  const alt = $('alt'), label = $('stage-label');
  if (compareWith) {
    alt.src = f[compareWith]; alt.hidden = false; $('photo').hidden = true; $('preview').hidden = true;
    label.textContent = `${b.textContent.trim()}, tap its button again to go back`; label.hidden = false;
  } else {
    alt.hidden = true; label.hidden = true; $('photo').hidden = false; drawn = null; schedulePreview(true);
  }
});

// ---------- controls ----------
dialRows.forEach(row => {
  const input = row.querySelector('input'), k = row.dataset.k;
  // While dragging: a quick preview. On release: save once, then a full-size preview.
  input.addEventListener('input', () => { drafts[cur] = {...(drafts[cur] || {}), [k]: +input.value}; paint(); schedulePreview(false); });
  input.addEventListener('change', () => { commitDraft(cur); schedulePreview(true); });
});
document.querySelectorAll('[data-rot]').forEach(b => b.addEventListener('click', () => {
  const r = current(cur);
  r.rotate = ((r.rotate + +b.dataset.rot) % 360 + 360) % 360;
  commit(cur, r);
}));
$('reset').addEventListener('click', () => { const r = current(cur); KEYS.forEach(k => { r[k] = rendered(byId[cur], k); }); commit(cur, r); });
toggles.forEach(b => b.addEventListener('click', () => { const r = current(cur); r[b.dataset.k] = !r[b.dataset.k]; commit(cur, r); }));
$('note').addEventListener('change', () => {
  const note = $('note').value.trim(), r = current(cur);
  if ((r.note || '') === note) return;
  r.note = note; commit(cur, r);
});
$('good').addEventListener('click', toggleGood);
$('reject').addEventListener('click', toggleReject);
$('undo').addEventListener('click', undo);
$('prev').addEventListener('click', () => move(-1));
$('next').addEventListener('click', () => move(1));
$('filter').addEventListener('change', e => applyFilter(e.target.value));
$('strip').addEventListener('click', e => { const b = e.target.closest('button[data-id]'); if (b) show(b.dataset.id); });
document.addEventListener('keydown', e => {
  const t = e.target, typing = t.tagName === 'INPUT' && t.type === 'text';
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !typing) { e.preventDefault(); undo(); return; }
  if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
  const onSlider = t.tagName === 'INPUT' && t.type === 'range';
  if (!onSlider && e.key === 'ArrowLeft') { e.preventDefault(); move(-1); }
  else if (!onSlider && e.key === 'ArrowRight') { e.preventDefault(); move(1); }
  else if (e.key === 'z' || e.key === 'Z') toggleZoom(stage.clientWidth / 2, stage.clientHeight / 2);
});

// ---------- start ----------
FRAMES.forEach(f => paintThumb(f.id));
paintCounts();
show(byId[store.get('apollo-review-at')] ? store.get('apollo-review-at') : FRAMES[0].id);

(async () => {
  const use = window.claude && window.claude.use ? n => window.claude.use(n) : async () => null;
  const [dbNs, u] = await Promise.all([use('db'), use('user')]);
  userNs = u;
  if (!dbNs) { $('offline').hidden = false; return; }
  db = dbNs;
  myId = u ? await u.id() : null;
  const allowed = u ? await u.can('data.write') : null;
  canWrite = allowed !== false;
  if (!canWrite) {
    $('offline').textContent = 'You can see the reviews but not change them. Ask the page owner for “Can interact” access to review.';
    $('offline').hidden = false;
  }
  let first = true;
  db.collection('reviews').onSnapshot(snap => {
    const changed = new Set();
    snap.docChanges().forEach(ch => {
      const id = ch.doc.id;
      if (!byId[id]) return;
      if (ch.type === 'removed') delete reviews[id]; else reviews[id] = ch.doc.data();
      changed.add(id);
    });
    changed.forEach(id => paintThumb(id));
    if (changed.size) paintCounts();
    if (changed.has(cur) || first) { paint(); schedulePreview(true); }
    const at = store.get('apollo-review-at');
    if (first && (!byId[at] || stateOf(at)[0] === 'good')) {   // start at the first photo still to review
      const next = FRAMES.find(f => stateOf(f.id)[0] !== 'good');
      if (next) show(next.id);
    }
    first = false;
  }, () => { $('offline').hidden = false; });
})();

</script>
