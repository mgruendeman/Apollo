<title>Apollo Photo Review</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
:root {
  --ground: #eef1ee; --surface: #ffffff; --ink: #1b2320; --muted: #5d6a65; --rule: #d3dad6;
  --accent: #b8741a; --accent-ink: #ffffff; --plate: #0b0d0c;
  --good: #2f7d4f; --good-soft: #e1f0e6; --flag: #b3541e; --flag-soft: #f8e7dc; --chip: #f3f5f3;
  --mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
  --sans: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --ground: #101513; --surface: #182019; --ink: #e3eae5; --muted: #98a69f; --rule: #2c3830; --accent: #e3a444; --accent-ink: #14100a; --good: #6cc48f; --good-soft: #1c3226; --flag: #f0975f; --flag-soft: #3a2518; --chip: #1f2922; color-scheme: dark; }
}
:root[data-theme="dark"] { --ground: #101513; --surface: #182019; --ink: #e3eae5; --muted: #98a69f; --rule: #2c3830; --accent: #e3a444; --accent-ink: #14100a; --good: #6cc48f; --good-soft: #1c3226; --flag: #f0975f; --flag-soft: #3a2518; --chip: #1f2922; color-scheme: dark; }
html, body { height: 100%; }
body { margin: 0; background: var(--ground); color: var(--ink); font: 15px/1.45 var(--sans); overflow: hidden; }
button { font-family: var(--sans); }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button:disabled, input:disabled { opacity: .45; cursor: not-allowed; }
.app { height: 100%; display: flex; flex-direction: column; }

/* top bar */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 8px 16px; background: var(--surface); border-bottom: 1px solid var(--rule); }
.top h1 { font-size: 1rem; margin: 0; white-space: nowrap; }
.counts { font: 600 .76rem/1.2 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; display: flex; gap: 10px; }
.counts b { color: var(--ink); }
.top .spacer { flex: 1; }
.top select { font: 500 .88rem var(--sans); padding: 5px 8px; border: 1px solid var(--rule); border-radius: 6px; background: var(--surface); color: var(--ink); }
.tbtn { font: 600 .88rem var(--sans); padding: 6px 12px; border: 1px solid var(--rule); border-radius: 6px; background: var(--chip); color: var(--ink); cursor: pointer; white-space: nowrap; }
.nav { display: flex; align-items: center; gap: 6px; }
.pos { font: 600 .8rem var(--mono); color: var(--muted); min-width: 4.5em; text-align: center; font-variant-numeric: tabular-nums; }

/* filmstrip */
.strip { display: flex; gap: 6px; overflow-x: auto; padding: 6px 16px; background: var(--surface); border-bottom: 1px solid var(--rule); scrollbar-width: thin; }
.strip button { flex: 0 0 auto; width: 48px; height: 48px; padding: 0; border: 2px solid transparent; border-radius: 6px; background: var(--plate); position: relative; cursor: pointer; }
.strip img { width: 100%; height: 100%; object-fit: cover; border-radius: 4px; display: block; }
.strip button[aria-current="true"] { border-color: var(--accent); }
.strip button::after { content: ""; position: absolute; right: 2px; bottom: 2px; width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--plate); background: transparent; }
.strip button[data-state="good"]::after { background: var(--good); }
.strip button[data-state="flag"]::after { background: var(--flag); }

/* work area */
.work { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 360px; }
.stage { position: relative; background: var(--plate); overflow: hidden; touch-action: none; cursor: zoom-in; user-select: none; -webkit-user-select: none; }
.stage.zoomed { cursor: grab; }
.zoomer { position: absolute; inset: 0; transform-origin: 0 0; }
.zoomer img, .zoomer canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; -webkit-user-drag: none; }
.stage-label { position: absolute; left: 10px; top: 10px; margin: 0; padding: 3px 8px; border-radius: 4px; background: rgba(0,0,0,.6); color: #e3eae5; font-size: .8rem; pointer-events: none; }
.zoom-ctl { position: absolute; right: 10px; bottom: 10px; display: flex; gap: 4px; }
.zoom-ctl button { width: 36px; height: 36px; border: 0; border-radius: 6px; background: rgba(0,0,0,.6); color: #e3eae5; font: 600 1.05rem var(--sans); cursor: pointer; }
.side { overflow-y: auto; padding: 14px 16px 28px; display: grid; gap: 12px; align-content: start; background: var(--surface); border-left: 1px solid var(--rule); }
.side header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 10px; }
.side h2 { margin: 0; font-size: 1.05rem; }
.fid { font: 600 .76rem/1 var(--mono); color: var(--muted); }
.status { font: 600 .7rem/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; padding: 4px 8px; border-radius: 4px; background: var(--chip); color: var(--muted); }
.status[data-state="good"] { background: var(--good-soft); color: var(--good); }
.status[data-state="flag"] { background: var(--flag-soft); color: var(--flag); }
.cap { margin: 0; font-size: .84rem; color: var(--muted); }
.good-btn { font: 600 1rem var(--sans); padding: 10px 12px; border-radius: 8px; border: 1px solid var(--good); background: transparent; color: var(--good); cursor: pointer; }
.good-btn[aria-pressed="true"] { background: var(--good); color: var(--surface); }
.verdicts { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.reject-btn { font: 600 .92rem var(--sans); padding: 10px 14px; border-radius: 8px; border: 1px solid var(--rule); background: var(--chip); color: var(--muted); cursor: pointer; }
.reject-btn[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.status[data-state="reject"] { background: var(--ink); color: var(--surface); }
.strip button[data-state="reject"] img { opacity: .3; }
.strip button[data-state="reject"]::after { background: var(--muted); }
.compare { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: .8rem; color: var(--muted); }
.compare button { display: flex; align-items: center; gap: 6px; padding: 3px 8px 3px 3px; border: 1px solid var(--rule); border-radius: 6px; background: var(--chip); color: var(--ink); font: 500 .8rem var(--sans); cursor: pointer; white-space: nowrap; }
.compare button[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.compare img { width: 30px; height: 30px; object-fit: cover; border-radius: 4px; background: var(--plate); }
.panel { display: grid; gap: 4px; }
.group-label { font: 600 .68rem/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 8px 0 2px; }
.dial { display: grid; grid-template-columns: 6.2em 1fr 3.2em; gap: 8px; align-items: center; font-size: .88rem; }
.dial input { width: 100%; accent-color: var(--accent); margin: 0; }
.dial output { font: 600 .8rem var(--mono); font-variant-numeric: tabular-nums; text-align: right; color: var(--muted); }
.dial[data-set="true"] output { color: var(--flag); }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: .88rem; }
.row button, .flags button { font: 500 .86rem var(--sans); padding: 6px 10px; border-radius: 6px; border: 1px solid var(--rule); background: var(--chip); color: var(--ink); cursor: pointer; }
.row .rot { font: 600 .8rem var(--mono); color: var(--muted); min-width: 5.5em; }
.row .reset { margin-left: auto; }
.flags { display: flex; flex-wrap: wrap; gap: 6px; }
.flags button[aria-pressed="true"] { background: var(--flag); border-color: var(--flag); color: var(--surface); }
.note { width: 100%; box-sizing: border-box; font: .9rem var(--sans); padding: 7px 9px; border: 1px solid var(--rule); border-radius: 6px; background: var(--ground); color: var(--ink); }
.hint { margin: 0; font-size: .78rem; color: var(--muted); min-height: 2.4em; }
.hint b { color: var(--flag); font-weight: 600; }
.keys { margin: 0; font-size: .74rem; color: var(--muted); }
.notice { margin: 0; padding: 8px 16px; background: var(--flag-soft); color: var(--ink); font-size: .88rem; }

@media (max-width: 760px) {
  .top { padding: 6px 12px; gap: 6px 10px; }
  .top h1, .counts .extra, .keys { display: none; }
  .strip { padding: 5px 12px; }
  .strip button { width: 40px; height: 40px; }
  .work { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 52fr) minmax(0, 48fr); }
  .side { border-left: 0; border-top: 1px solid var(--rule); padding: 12px 16px 24px; }
}
</style>
<div class="app">
  <div class="top">
    <h1>Apollo Photo Review</h1>
    <div class="counts" id="counts"></div>
    <span class="spacer"></span>
    <label><span hidden>Show</span><select id="filter" aria-label="Show">
      <option value="all">All photos</option>
      <option value="todo">To review</option>
      <option value="flag">Needs work</option>
      <option value="good">Looks good</option>
      <option value="reject">Rejected</option>
    </select></label>
    <button type="button" class="tbtn" id="undo" disabled>Undo</button>
    <div class="nav">
      <button type="button" class="tbtn" id="prev" aria-label="Previous photo">‹</button>
      <span class="pos" id="pos"></span>
      <button type="button" class="tbtn" id="next" aria-label="Next photo">›</button>
    </div>
  </div>
  <p class="notice" id="offline" hidden>Reviews can't be saved in this view. Open the page in Claude to review.</p>
  <nav class="strip" id="strip" aria-label="Photos"></nav>
  <div class="work">
    <div class="stage" id="stage">
      <div class="zoomer" id="zoomer">
        <img id="photo" alt="">
        <canvas id="preview" hidden></canvas>
        <img id="alt" alt="" hidden>
      </div>
      <p class="stage-label" id="stage-label" hidden></p>
      <div class="zoom-ctl">
        <button type="button" id="zoom-out" aria-label="Zoom out">−</button>
        <button type="button" id="zoom-in" aria-label="Zoom in">+</button>
      </div>
    </div>
    <aside class="side" id="side">
      <header><h2 id="title"></h2><span class="status" id="status"></span></header>
      <p class="cap" id="cap"></p>
      <div class="verdicts">
        <button type="button" class="good-btn" id="good" aria-pressed="false">Looks good</button>
        <button type="button" class="reject-btn" id="reject" aria-pressed="false" title="A bad or unusable frame: leave it off the site">Reject</button>
      </div>
      <div class="compare" id="compare"></div>
      <div class="panel" id="panel"></div>
      <div class="row"><span>Rotate</span><button type="button" data-rot="-90" aria-label="Rotate left">↺</button><button type="button" data-rot="90" aria-label="Rotate right">↻</button><span class="rot" id="rot">none</span><button type="button" class="reset" id="reset">Reset all</button></div>
      <div class="flags" id="flags" role="group" aria-label="Needs a hand fix"></div>
      <input class="note" id="note" type="text" maxlength="300" placeholder="Note (optional), e.g. crop cuts off the flag">
      <p class="hint" id="hint"></p>
      <p class="keys">Tap the photo to zoom; pinch or scroll to zoom further, drag to move. Keys: ← → photos, Z zoom, Ctrl/⌘+Z undo.</p>
    </aside>
  </div>
</div>
<script>

</script>
